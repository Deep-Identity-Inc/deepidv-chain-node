name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: install
        run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format check
        run: npm run format:check

      - name: unit tests (parity + crypto + client + sse + verify)
        run: npm test

      - name: build (dual ESM + CJS)
        run: npm run build

      - name: brand check (no forbidden refs in dist or sources)
        run: |
          set -e
          # User-facing identifiers we must never ship.
          FORBIDDEN_BRANDS='Arc|UAIIP|getai\.id|deeprisk|DeepIDV|Deep IDV|Deep ID V|deepsign|Dallas|Toronto'
          # Look in src + README + CHANGELOG. dist is a build artifact;
          # if the source is clean, dist is clean.
          if grep -REn "$FORBIDDEN_BRANDS" src README.md CHANGELOG.md examples docs ; then
            echo "::error ::Forbidden brand reference found"
            exit 1
          fi

  integration:
    name: integration (staging)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: smoke probe staging endpoints
        env:
          STAGING_API_URL: https://staging-api.deepidv.com
        run: |
          set -e
          # /v1/log should return 200 unauthenticated.
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            "$STAGING_API_URL/v1/log" | grep -E '^(200|2\d\d)$' \
            || { echo "::warning ::staging /v1/log not 2xx — this is non-blocking until M06a is fully wired"; true; }

          # /governance must require auth.
          status=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_API_URL/governance" || true)
          case "$status" in
            401|403)
              echo "ok: /governance requires auth ($status)"
              ;;
            *)
              echo "::warning ::staging /governance returned $status (expected 401/403); non-blocking"
              ;;
          esac
